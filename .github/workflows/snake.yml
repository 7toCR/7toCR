name: Generate Contribution Snake

on:
  # 每天自动更新一次（UTC 00:00）
  schedule:
    - cron: "0 0 * * *"

  # 支持在 Actions 页面手动运行
  workflow_dispatch:

  # 修改工作流后立即运行
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 7toCR
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2563EB&color_dots=#EBEDF0,#BFDBFE,#93C5FD,#3B82F6,#1D4ED8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161B22,#312E81,#4F46E5,#7C3AED,#C4B5FD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
